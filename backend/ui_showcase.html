<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>界面主题 · PrismMail</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var mode = localStorage.getItem('prism_color_mode') || 'system';
      document.documentElement.setAttribute('data-mode', mode);
    })();
  </script>
  <style>
    :root {
      --bg: #f6f6f8;
      --fg: #18181b;
      --muted: #71717a;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover: rgba(0, 0, 0, 0.22);
      --card-active: #18181b;
      --pill-bg: #f4f4f5;
      --pill-border: rgba(0, 0, 0, 0.07);
      --badge-bg: #18181b;
      --badge-fg: #ffffff;
      --shadow: 0 20px 44px -16px rgba(0, 0, 0, 0.10);
    }
    :root[data-mode="dark"] {
      --bg: #09090b;
      --fg: #f4f4f6;
      --muted: #a1a1aa;
      --card-bg: #111115;
      --card-border: rgba(255, 255, 255, 0.09);
      --card-hover: rgba(255, 255, 255, 0.24);
      --card-active: rgba(255, 255, 255, 0.45);
      --pill-bg: rgba(255, 255, 255, 0.045);
      --pill-border: rgba(255, 255, 255, 0.08);
      --badge-bg: #f4f4f5;
      --badge-fg: #09090b;
      --shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.72);
    }
    @media (prefers-color-scheme: dark) {
      :root[data-mode="system"] {
        --bg: #09090b;
        --fg: #f4f4f6;
        --muted: #a1a1aa;
        --card-bg: #111115;
        --card-border: rgba(255, 255, 255, 0.09);
        --card-hover: rgba(255, 255, 255, 0.24);
        --card-active: rgba(255, 255, 255, 0.45);
        --pill-bg: rgba(255, 255, 255, 0.045);
        --pill-border: rgba(255, 255, 255, 0.08);
        --badge-bg: #f4f4f5;
        --badge-fg: #09090b;
        --shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.72);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 56px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 1060px;
    }
    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 34px;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }
    .sub {
      color: var(--muted);
      font-size: 13.5px;
    }
    .back-btn {
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--fg);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: border-color 0.16s ease;
    }
    .back-btn:hover {
      border-color: var(--card-hover);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 18px;
      padding: 22px;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
      min-height: 304px;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--card-hover);
      box-shadow: var(--shadow);
    }
    .card.is-active {
      border-color: var(--card-active);
      box-shadow: var(--shadow);
    }
    .active-badge {
      display: none;
      align-items: center;
      padding: 2.5px 9px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-fg);
      font-size: 11px;
      font-weight: 600;
    }
    .card.is-active .active-badge {
      display: inline-flex;
    }
    .preview {
      height: 128px;
      border-radius: 12px;
      margin-bottom: 18px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(128, 128, 128, 0.14);
      position: relative;
      overflow: hidden;
    }
    .p-v2 {
      background: radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.16), transparent 55%),
                  linear-gradient(180deg, #15151b 0%, #0b0b0f 100%);
      color: #f4f4f5;
    }
    .p-apple {
      background: linear-gradient(135deg, #f2f2f7 0%, #ffffff 58%, #e5f1ff 100%);
      color: #1d1d1f;
    }
    .p-editorial {
      background: #f5f2eb;
      color: #171614;
      border-radius: 4px;
    }
    .dots { display: flex; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 999px; }
    .tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      opacity: 0.78;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-desc {
      font-size: 13px;
      line-height: 1.65;
      color: var(--muted);
    }
    .url-pill {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      font-size: 12px;
      color: var(--fg);
    }
    .pill-muted { color: var(--muted); }
    .pill-action { font-weight: 500; }
    @media (max-width: 640px) {
      body {
        padding: 28px 16px max(28px, env(safe-area-inset-bottom));
        justify-content: flex-start;
      }
      .header-row {
        margin-bottom: 20px;
        align-items: flex-start;
      }
      h1 {
        font-size: 22px;
      }
      .grid {
        gap: 14px;
      }
      .card {
        min-height: auto;
        padding: 18px;
        border-radius: 16px;
      }
      .preview {
        height: 104px;
        margin-bottom: 14px;
      }
    }
  </style>
</head>

  <script>
    async function initShowcase() {
      try {
        const res = await fetch('/api/settings/ui');
        if (!res.ok) return;
        const data = await res.json();
        const active = data.ui_edition || 'v2';
        if (data.color_mode) {
          localStorage.setItem('prism_color_mode', data.color_mode);
          document.documentElement.setAttribute('data-mode', data.color_mode);
        }
        document.getElementById('backCurrentBtn').href = `/${active}/`;
        document.querySelectorAll('.card[data-edition]').forEach(card => {
          const isCurrent = card.dataset.edition === active;
          card.classList.toggle('is-active', isCurrent);
          const act = card.querySelector('.pill-action');
          if (act) act.textContent = isCurrent ? '进入工作台 →' : '应用主题 →';
        });
      } catch {}
    }

    document.querySelectorAll('.card[data-edition]').forEach(card => {
      card.addEventListener('click', async (e) => {
        e.preventDefault();
        const edition = card.dataset.edition;
        try {
          await fetch('/api/settings/ui', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'PrismMail' },
            body: JSON.stringify({ ui_edition: edition })
          });
        } catch {}
        window.location.href = `/${edition}/`;
      });
    });

    initShowcase();
  </script>
